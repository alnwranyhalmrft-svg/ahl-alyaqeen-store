<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>البث المباشر — أهل اليقين</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
p{position:fixed;inset:0;display:grid;place-items:center;margin:0;opacity:.7}
</style>
</head>
<body>
<p id="m">جاري تشغيل البث…</p>
<script>
(function(){
  var ch=new URLSearchParams(location.search).get('ch')||'';
  if(!/^UC[\w-]{22}$/.test(ch)){document.getElementById('m').textContent='القناة غير صحيحة';return;}
  var f=document.createElement('iframe');
  f.src='https://www.youtube.com/embed/live_stream?channel='+ch+'&autoplay=1&playsinline=1&rel=0&modestbranding=1';
  f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';
  f.allowFullscreen=true;
  f.referrerPolicy='strict-origin-when-cross-origin';
  f.title='البث المباشر';
  document.body.appendChild(f);
})();
</script>
</body>
</html>
