<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>البث المباشر — أهل اليقين</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
p{position:fixed;inset:0;display:grid;place-items:center;margin:0;opacity:.7}
</style>
</head>
<body>
<p id="m">جاري تشغيل البث…</p>
<script>
(function(){
  var q=new URLSearchParams(location.search),ch=q.get('ch')||'',v=q.get('v')||'',src='';
  var extra=(q.get('mute')==='1'?'&mute=1':'')+(q.get('enablejsapi')==='1'?'&enablejsapi=1':'');
  if(/^[\w-]{11}$/.test(v))src='https://www.youtube.com/embed/'+v+'?autoplay=1&playsinline=1&rel=0&modestbranding=1'+extra;
  else if(/^UC[\w-]{22}$/.test(ch))src='https://www.youtube.com/embed/live_stream?channel='+ch+'&autoplay=1&playsinline=1&rel=0&modestbranding=1';
  if(!src){document.getElementById('m').textContent='الرابط غير صحيح';return;}
  var f=document.createElement('iframe');
  f.src=src;
  f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';
  f.allowFullscreen=true;
  f.referrerPolicy='strict-origin-when-cross-origin';
  f.title='البث المباشر';
  document.body.appendChild(f);
  // يوصّل أوامر الصوت (كتم / تشغيل) من التطبيق إلى مشغّل يوتيوب
  window.addEventListener('message',function(e){if(e.source===f.contentWindow)return;try{f.contentWindow.postMessage(e.data,'https://www.youtube.com');}catch(_){}});
})();
</script>
</body>
</html>
